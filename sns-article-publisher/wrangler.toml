name = "sns-article-publisher"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# admin-pages から Service Binding の RPC でだけ呼ぶため、HTTP の入口（ルート・workers.dev）は持たない
# routes を書かないと wrangler は workers.dev を既定で有効にするので明示的に閉じる
workers_dev = false

[images]
binding = "IMAGES"

[dev]
port = 30254

[env.staging]
name = "sns-article-publisher-stg"
workers_dev = false

[env.staging.images]
binding = "IMAGES"

[observability]
enabled = true
